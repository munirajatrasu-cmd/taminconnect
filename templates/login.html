<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1c"><title>Sign in • TaminConnect</title>
<style>
:root{color-scheme:dark;--line:#ffffff19;--muted:#93a1bb;--cyan:#4de2e8;--blue:#829aff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,#182957 0,transparent 42%),radial-gradient(ellipse at 85% 80%,#123d4d 0,transparent 40%),#080d1c;font-family:Inter,system-ui,Segoe UI,sans-serif;color:#f4f7ff}.grid{position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(black,transparent)}.panel{position:relative;width:min(100%,440px);padding:38px;border:1px solid var(--line);border-radius:26px;background:#0f172ccc;backdrop-filter:blur(22px);box-shadow:0 28px 100px #0008}.brand{display:flex;align-items:center;gap:13px;margin-bottom:34px}.mark{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#06101b;font-weight:950;font-size:20px;background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 0 32px #4de2e833}.brand b{font-size:18px;letter-spacing:.14em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.22em;margin-top:3px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800}.panel h1{font-size:30px;letter-spacing:-.04em;margin:10px 0 8px}.intro{color:var(--muted);font-size:14px;margin:0 0 28px;line-height:1.6}label{display:block;font-size:12px;color:#cbd4e6;margin:17px 0 8px}input{width:100%;padding:15px 16px;border-radius:13px;border:1px solid var(--line);background:#080f20;color:white;font-size:14px;outline:none}input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #4de2e81c}button{width:100%;border:0;border-radius:13px;padding:15px;margin-top:22px;background:linear-gradient(100deg,#3bd9dc,#829aff);color:#07101b;font-weight:850;font-size:14px;letter-spacing:.04em;cursor:pointer;transition:.2s}button:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 12px 32px #4de2e82b}.error{margin-top:15px;color:#ff9d9d;text-align:center;font-size:13px}.foot{border-top:1px solid var(--line);margin-top:28px;padding-top:18px;color:#71809b;font-size:11px;text-align:center;letter-spacing:.08em}
</style></head><body><div class="grid"></div><main class="panel"><div class="brand"><div class="mark">T</div><div><b>TAMINCONNECT</b><small>CONTACT CENTER PLATFORM</small></div></div><div class="eyebrow">Secure workspace access</div><h1>Welcome back.</h1><p class="intro">Sign in to open your command center and manage your contact operations.</p>
<form action="/" method="POST"><label for="username">DIALER USERNAME</label><input id="username" type="text" name="username" placeholder="Enter your username" autocomplete="username" required><label for="password">PASSWORD</label><input id="password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required><button type="submit">ENTER COMMAND CENTER →</button></form>
{% with messages = get_flashed_messages() %}{% for message in messages %}<p class="error">{{ message }}</p>{% endfor %}{% endwith %}<div class="foot">TAMINCONNECT • PRIVATE &amp; SECURE</div></main></body></html>
